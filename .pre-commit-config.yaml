repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: pixi run -e dev ruff check
        language: system
        types: [python]
      - id: pixi-lock-check
        name: pixi.lock up-to-date with pyproject.toml
        entry: pixi lock --check
        language: system
        # Only run when the dependency inputs or the lock itself change.
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
